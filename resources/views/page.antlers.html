<article class="wrap page">
    <header class="page-header">
        <h1>{{ title }}</h1>
        {{ if intro }}<p class="lede">{{ intro }}</p>{{ /if }}
    </header>
    {{ hero }}
        <img class="page-image" src="{{ url }}" alt="{{ alt }}" width="{{ width }}" height="{{ height }}">
    {{ /hero }}
    <div class="prose">
        {{ partial:bard }}
    </div>
</article>
